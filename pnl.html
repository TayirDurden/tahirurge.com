        // --- YARDIMCI FONKSİYONLAR ---
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(value || 0);
        };

        const formatDateForExcel = (dateStr) => {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}.${month}.${year}`;
        };

        const parseExcelDateToISO = (dateVal) => {
            if (!dateVal) return '';
            
            if (dateVal instanceof Date && !isNaN(dateVal)) {
                const year = dateVal.getFullYear();
                const month = String(dateVal.getMonth() + 1).padStart(2, '0');
                const day = String(dateVal.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            if (!isNaN(dateVal) && !String(dateVal).includes('.')) {
                const serial = Number(dateVal);
                const jsDate = new Date(Math.round((serial - 25569) * 86400 * 1000));
                const year = jsDate.getUTCFullYear();
                const month = String(jsDate.getUTCMonth() + 1).padStart(2, '0');
                const day = String(jsDate.getUTCDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            let dateStr = String(dateVal).trim();
            if (dateStr.includes(' ')) dateStr = dateStr.split(' ')[0];

            const parts = dateStr.split(/[-./]/);
            if (parts.length === 3) {
                let day, month, year;
                if (parts[0].length === 4) {
                    year = parts[0]; month = parts[1]; day = parts[2];
                } else {
                    year = parts[2].length === 2 ? `20${parts[2]}` : parts[2];
                    month = parts[1]; day = parts[0];
                }
                return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            }
            return String(dateVal);
        };

        const generateDayLabel = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date)) return '';
            const months = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
            const day = String(date.getDate()).padStart(2, '0');
            const month = months[date.getMonth()];
            return `${day} ${month}`;
        };

        const COLOR_PALETTE = ['#a855f7', '#ef4444', '#3b82f6', '#eab308', '#fb7185', '#14b8a6', '#f97316', '#6366f1', '#8b5cf6', '#0ea5e9'];

        const EXPENSE_CATEGORIES = [
            "Hammadde", "Sarf Malzeme", "Doğalgaz", "Elektrik", "Su", "İlaçlama",
            "Personel Maaş", "Personel SGK", "Personel Yemek", "Dükkan Kirası", 
            "Vergi", "Muhasebe", "Danışmanlık", "Lojistik", "İletişim", "Kasko/Sigorta", 
            "Amortisman", "Tamir/Tadilat", "Ciro Primi", "Ek Giderler", "Diğer"
        ];

        const getMajorCategory = (cat) => {

            if (["Doğalgaz", "Elektrik", "Su", "İlaçlama"].includes(cat)) return 'energy';

        };

        // --- BAŞLANGIÇ VERİ SETLERİ (Sistem ilk kurulduğunda yüklenir) ---
        const initialBanks = [

        ];

        const initialCommissionRules = [
            { id: 1, bankId: 'qnb', rate: 1.5, startDate: '2026-01-01', endDate: '' },
            { id: 2, bankId: 'akbank1', rate: 1.2, startDate: '2026-01-01', endDate: '' },
            { id: 3, bankId: 'yapiKredi', rate: 1.4, startDate: '2026-01-01', endDate: '' },

        ];

        const initialPosData = []; // Bulut tabanlı sistemde varsayılanları boşaltıyoruz ki gerçek veriler kullanılsın
        const initialTransactions = [];

        // --- BİLEŞENLER ---
        
        // 1. GİRİŞ EKRANI BİLEŞENİ (YENİ)

        // 2. DASHBOARD VE ADMIN BİLEŞENLERİ KULLANDIĞI GRAFİKLER
        function KPICard({ title, value, icon, trend, trendUp, bg }) {
            const trendClass = trendUp ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700';
            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col hover:shadow-md transition-shadow">
                    <div className="flex justify-between items-start mb-4">
                        <div className={`p-3 rounded-xl ${bg}`}>{icon}</div>
                        <div className={`flex items-center gap-1 text-xs font-bold px-2 py-1 rounded-full ${trendClass}`}>{trend}</div>
                    </div>
                    <div>
                        <h3 className="text-slate-500 text-sm font-medium mb-1">{title}</h3>
                        <p className="text-2xl font-bold text-slate-800 tracking-tight">{value}</p>
                    </div>
                </div>
            );
        }

        function ProgressBar({ label, value, total, color, icon }) {
            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
            return (
                <div className="w-full">
                    <div className="flex justify-between text-sm mb-2">
                        <span className="font-medium text-slate-700 flex items-center gap-1">
                            <span className="text-slate-400">{icon}</span> {label}
                        </span>
                        <div className="text-right">
                            <span className="font-bold text-slate-800">{formatCurrency(value)}</span>
                            <span className="text-slate-400 text-xs ml-2">({percentage}%)</span>
                        </div>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                        <div className={`h-2.5 rounded-full`} style={{ width: `${percentage}%`, backgroundColor: color }}></div>
                    </div>
                </div>
            );
        }

        function PieChartGraphic({ data, size = 160 }) {
            const total = data.reduce((acc, curr) => acc + curr.value, 0);
            if (total === 0) return <div className="rounded-full bg-slate-100 flex items-center justify-center text-xs text-slate-400 font-medium" style={{ width: size, height: size }}>Veri Yok</div>;

            let cumulativeAngle = -Math.PI / 2;

            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="transform transition-transform hover:scale-105">
                    {data.map((slice, i) => {
                        if (slice.value === 0) return null;
                        if (slice.value === total) {
                            return (
                                <g key={i}>
                                    <circle cx={size/2} cy={size/2} r={size/2} fill={slice.color} title={`${slice.label}: ${formatCurrency(slice.value)}`} className="cursor-pointer hover:opacity-80 transition-opacity" />
                                </g>
                            );
                        }
                        
                        const angle = (slice.value / total) * Math.PI * 2;
                        const startX = size/2 + (size/2) * Math.cos(cumulativeAngle);
                        const startY = size/2 + (size/2) * Math.sin(cumulativeAngle);
                        cumulativeAngle += angle;
                        const endX = size/2 + (size/2) * Math.cos(cumulativeAngle);
                        const endY = size/2 + (size/2) * Math.sin(cumulativeAngle);
                        const largeArcFlag = angle > Math.PI ? 1 : 0;
                        
                        const pathData = [`M ${size/2} ${size/2}`,`L ${startX} ${startY}`,`A ${size/2} ${size/2} 0 ${largeArcFlag} 1 ${endX} ${endY}`,'Z'].join(' ');

                        return <path key={i} d={pathData} fill={slice.color} title={`${slice.label}: ${formatCurrency(slice.value)}`} className="cursor-pointer hover:opacity-80 transition-opacity stroke-white stroke-2" />;
                    })}
                    <circle cx={size/2} cy={size/2} r={size/2.5} fill="#ffffff" className="pointer-events-none" />
                </svg>
            );
        }

        function DashboardView({ banks, commissionRules, posDailyTrend, recentTransactions, setView }) {
            const [startDate, setStartDate] = useState('2026-04-01');
            const [endDate, setEndDate] = useState('2026-04-30');
            
            const [txCurrentPage, setTxCurrentPage] = useState(1);
            const [txItemsPerPage, setTxItemsPerPage] = useState(25);

            const availablePeriods = useMemo(() => {
                const periods = {};
                const allDates = [...posDailyTrend.map(d => d.date), ...recentTransactions.map(t => t.date)];
                
                allDates.forEach(dateStr => {
                    if (!dateStr) return;
                    const [year, month] = dateStr.split('-');
                    if (!year || !month) return;
                    
                    if (!periods[year]) periods[year] = new Set();
                    periods[year].add(parseInt(month, 10));
                });
                
                Object.keys(periods).forEach(year => {
                    periods[year] = Array.from(periods[year]).sort((a, b) => a - b);
                });
                return periods;
            }, [posDailyTrend, recentTransactions]);

            const availableYears = Object.keys(availablePeriods).sort((a, b) => b - a);
            const [shortcutYear, setShortcutYear] = useState('');
            const [shortcutMonth, setShortcutMonth] = useState('');

            useEffect(() => {
                if (availableYears.length > 0 && !shortcutYear) {
                    setShortcutYear(availableYears[0]);
                }
            }, [availableYears, shortcutYear]);

            useEffect(() => {
                if (startDate && endDate) {
                    const startD = new Date(startDate);
                    const endD = new Date(endDate);
                    
                    if (startD.getFullYear() === endD.getFullYear() && startD.getMonth() === endD.getMonth()) {
                        const lastDayOfStartMonth = new Date(startD.getFullYear(), startD.getMonth() + 1, 0).getDate();
                        if (startD.getDate() === 1 && endD.getDate() === lastDayOfStartMonth) {
                            setShortcutYear(String(startD.getFullYear()));
                            setShortcutMonth(String(startD.getMonth() + 1));
                            return;
                        }
                    }
                }
                setShortcutMonth('');
            }, [startDate, endDate]);

            const monthsTr = ['', 'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

            const handleMonthSelect = (e) => {
                const monthNum = e.target.value;
                setShortcutMonth(monthNum);
                if (!monthNum || !shortcutYear) return;
                
                const monthStr = String(monthNum).padStart(2, '0');
                const start = `${shortcutYear}-${monthStr}-01`;
                const lastDay = new Date(shortcutYear, monthNum, 0).getDate();
                const end = `${shortcutYear}-${monthStr}-${lastDay}`;
                
                setStartDate(start);
                setEndDate(end);
            };

            let start = new Date(startDate);
            let end = new Date(endDate);
            if (start > end) { const temp = start; start = end; end = temp; }
            const activeStart = start.toISOString().split('T')[0];
            const activeEnd = end.toISOString().split('T')[0];

            useEffect(() => { setTxCurrentPage(1); }, [activeStart, activeEnd, txItemsPerPage]);

            const filteredPosData = useMemo(() => {
                return posDailyTrend.filter(d => d.date >= activeStart && d.date <= activeEnd);
            }, [posDailyTrend, activeStart, activeEnd]);

                newData[index][field] = (field === 'date' || field === 'day') ? value : Number(value);
                if (field !== 'cash' && field !== 'date' && field !== 'day') {
                   newData[index].value = banks.reduce((sum, b) => sum + (newData[index][b.id] || 0), 0);
                }
                setPosData(newData);
            };

            const addBank = () => {
                const newId = 'bank_' + Date.now();
                const randomColor = COLOR_PALETTE[banks.length % COLOR_PALETTE.length];

            };

            const updateBank = (id, field, value) => { setBanks(banks.map(b => b.id === id ? { ...b, [field]: value } : b)); };
            const deleteBank = (id) => {
                if(confirm("Bu bankayı silmek istediğinize emin misiniz? (Geçmiş POS verilerindeki sütunları da silinecektir.)")) {
                    setBanks(banks.filter(b => b.id !== id));
                    setCommissionRules(commissionRules.filter(r => r.bankId !== id));
                }
            };

            const addCommissionRule = () => {
                if(banks.length === 0) return alert("Önce banka eklemelisiniz.");
                setCommissionRules([{ id: Date.now(), bankId: banks[0].id, rate: 0, startDate: new Date().toISOString().split('T')[0], endDate: '' }, ...commissionRules]);
            };

            const updateCommissionRule = (id, field, value) => { setCommissionRules(commissionRules.map(r => r.id === id ? { ...r, [field]: value } : r)); };

            const handleExport = () => {
                if (!window.XLSX) return alert("Excel kütüphanesi yükleniyor, lütfen bekleyin.");

                const exportPosData = posData.map(p => {
                    const row = { "Tarih": formatDateForExcel(p.date), "Etiket": p.day || generateDayLabel(p.date), "Nakit Geliri": p.cash || 0 };

                    return row;

                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportPosData), "POS_ve_Nakit");
                
                const exportTxData = transactions.map(t => ({ "Tarih": formatDateForExcel(t.date), "Tedarikçi/Açıklama": t.supplier, "Kategori": t.category, "Tutar": t.amount }));

                const exportBanks = banks.map(b => ({ "Banka ID": b.id, "Banka Adı": b.name, "Renk": b.color }));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exportBanks), "Bankalar");

                const exportCommData = commissionRules.map(r => ({ "Banka ID": r.bankId, "Oran (%)": r.rate, "Başlangıç": formatDateForExcel(r.startDate), "Bitiş": r.endDate ? formatDateForExcel(r.endDate) : "Güncel" }));

                transactions.forEach(tx => { if(expensesSummary[tx.category] !== undefined) expensesSummary[tx.category] += Number(tx.amount || 0); });

                    { "Rapor": "Nakit Gelir", "Tutar": posData.reduce((s,i)=>s+(i.cash||0),0) },
                    { "Rapor": "POS Gelir", "Tutar": posData.reduce((s,i)=>s+(i.value||0),0) },
                    { "Rapor": "---", "Tutar": "---" },
                    ...Object.entries(expensesSummary).map(([cat, val]) => ({ "Rapor": `Gider: ${cat}`, "Tutar": val }))

                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), "Hesaplanmis_Ozet");

                XLSX.writeFile(wb, "Sistem_Tam_Yedek.xlsx");

            const handleImport = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();

                    const data = evt.target.result;
                    const wb = XLSX.read(data, { type: 'binary', cellDates: true });

                                    day: row["Etiket"] || generateDayLabel(parseExcelDateToISO(row["Tarih"])),

                                    value: Number(row["Toplam POS"]) || 0

                            setCommissionRules(mappedRules);

                                            </div>
                                            
                                            <div className="flex flex-col gap-4">
                                                <h3 className="font-semibold text-orange-800 bg-orange-50 p-3 rounded-lg border border-orange-100 flex justify-between">
                                                    <span>Hammadde & Sarf</span>
                                                    <span>{formatCurrency(summaryData.exp.rawMaterials)}</span>
                                                </h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">Hammadde Alımı</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['Hammadde'])}</span></div>
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">Sarf Malzeme</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['Sarf Malzeme'])}</span></div>
                                                </div>

                                                <h3 className="font-semibold text-amber-800 bg-amber-50 p-3 rounded-lg border border-amber-100 flex justify-between mt-2">
                                                    <span>Enerji Giderleri</span>
                                                    <span>{formatCurrency(summaryData.exp.energy)}</span>
                                                </h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">Doğalgaz</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['Doğalgaz'])}</span></div>
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">Elektrik</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['Elektrik'])}</span></div>
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">Su</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['Su'])}</span></div>
                                                    <div className="bg-slate-50 p-2 rounded border border-slate-200"><span className="block text-[10px] text-slate-500">İlaçlama</span><span className="font-bold text-sm">{formatCurrency(summaryData.subCats['İlaçlama'])}</span></div>
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-4">
                                                <h3 className="font-semibold text-purple-800 bg-purple-50 p-3 rounded-lg border border-purple-100 flex justify-between">
                                                    <span>Diğer Giderler</span>
                                                    <span>{formatCurrency(summaryData.exp.other)}</span>
                                                </h3>
                                                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                                                    {[ "Dükkan Kirası", "Vergi", "Muhasebe", "Danışmanlık", "Lojistik", "İletişim", "Kasko/Sigorta", "Amortisman", "Tamir/Tadilat", "Ciro Primi", "Ek Giderler", "Diğer" ].map(cat => (
                                                        <div key={cat} className="bg-slate-50 p-2 rounded border border-slate-200">
                                                            <span className="block text-[10px] text-slate-500 truncate" title={cat}>{cat}</span>
                                                            <span className="font-bold text-sm">{formatCurrency(summaryData.subCats[cat])}</span>
                                                        </div>
                                                    ))}
                                                </div>

                                                <h3 className="font-semibold text-slate-800 bg-slate-200 p-3 rounded-lg border border-slate-300 flex justify-between mt-2">
                                                    <span className="flex items-center gap-2"><Percent className="w-4 h-4"/> Otomatik Banka Komisyonu</span>
                                                    <span>{formatCurrency(summaryData.exp.commission)}</span>
                                                </h3>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeAdminTab === 'excel' && (
                                    <div>
                                        <h2 className="text-lg font-bold mb-4 border-b pb-2">Excel İle Veri Transferi</h2>
                                        <p className="text-sm text-slate-500 mb-8 leading-relaxed">Sisteminiz tamamen İşlem (Ledger) bazlı çalışmaktadır. Yedeğinizi aldığınızda Banka ayarlarınız, komisyon kurallarınız, Fişleriniz ve POS girişleriniz Excel olarak indirilir.</p>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="border border-slate-200 p-6 rounded-2xl flex flex-col items-center justify-center text-center gap-4 hover:border-emerald-300 transition-colors bg-emerald-50/30">
                                                <div className="bg-white p-4 rounded-full shadow-sm text-emerald-600"><Download className="w-8 h-8"/></div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800">Tüm Verileri Yedekle</h3>
                                                    <p className="text-xs text-slate-500 mt-1">Sistemi 5 sekmeli Excel (.xlsx) olarak indirir.</p>
                                                </div>
                                                <button onClick={handleExport} className="px-6 py-3 bg-emerald-600 text-white rounded-lg font-bold hover:bg-emerald-700 w-full transition-colors shadow-sm">Excel Olarak İndir</button>
                                            </div>

                                            <div className="border border-slate-200 p-6 rounded-2xl flex flex-col items-center justify-center text-center gap-4 hover:border-indigo-300 transition-colors bg-indigo-50/30">
                                                <div className="bg-white p-4 rounded-full shadow-sm text-indigo-600"><Upload className="w-8 h-8"/></div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800">Yedekten Geri Yükle</h3>
                                                    <p className="text-xs text-slate-500 mt-1">Daha önce indirdiğiniz formattaki Excel'i yükler ve <b>buluta kaydeder.</b></p>
                                                </div>
                                                <label className="px-6 py-3 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 w-full cursor-pointer transition-colors shadow-sm text-center">

            );
        }

        // --- ANA UYGULAMA BİLEŞENİ (BULUT VE GİRİŞ KONTROLLERİ BURADA YAPILIR) ---
        function App() {
            const [view, setView] = useState('dashboard');
            
            // Bulut ve Giriş Stateleri
            const [user, setUser] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [firebaseError, setFirebaseError] = useState(false);

            // Veri Stateleri (Başlangıçta boşlar, buluttan dolacaklar)
            const [banks, setBanks] = useState([]);
            const [commissionRules, setCommissionRules] = useState([]);
            const [posData, setPosData] = useState([]);
            const [transactions, setTransactions] = useState([]);

            // 1. Firebase Yetkilendirme (Misafir Girişi)
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            // Sitenizde çalışması için Firebase Console'dan Anonymous Auth açılmalıdır!
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Firebase Kimlik Doğrulama Hatası:", e);
                        setFirebaseError(true);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // 2. Kullanıcı Giriş Yaptığında Verileri Buluttan Çekme (Senkronizasyon)
            useEffect(() => {
                if (!user || !isLoggedIn) return;

                // Buluttaki veritabanı belgemizin adresi
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'appState', 'main');
                
                // onSnapshot ile anlık dinleme yapıyoruz, siz mobilden güncellerseniz PC'de de anında güncellenir.
                const unsub = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        // Bulutta veri varsa devral, yoksa boş dizi bırak
                        setPosData(data.posData || []);
                        setTransactions(data.transactions || []);
                        setBanks(data.banks || []);
                        setCommissionRules(data.commissionRules || []);
                    } else {
                        // Sisteme İLK DEFA girildiğinde varsayılan ayarları kaydet
                        setDoc(docRef, {
                            posData: initialPosData,
                            transactions: initialTransactions,
                            banks: initialBanks,
                            commissionRules: initialCommissionRules
                        });
                    }
                    setIsLoadingData(false);
                }, (err) => {
                    console.error("Bulut Veri Çekme Hatası:", err);
                    setFirebaseError(true);
                });

                return () => unsub();
            }, [user, isLoggedIn]);

            // 3. Veri Değiştiğinde Buluta Gönderme (Kaydetme) Fonksiyonları
            const saveToFirestore = (field, data) => {
                if (!user || !isLoggedIn) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'appState', 'main');
                setDoc(docRef, { [field]: data }, { merge: true });
            };

            const handleSetPosData = (data) => { setPosData(data); saveToFirestore('posData', data); };
            const handleSetTransactions = (data) => { setTransactions(data); saveToFirestore('transactions', data); };
            const handleSetBanks = (data) => { setBanks(data); saveToFirestore('banks', data); };
            const handleSetCommissionRules = (data) => { setCommissionRules(data); saveToFirestore('commissionRules', data); };


            // --- EKRAN YÖNLENDİRMELERİ ---
            
            // Hata Durumu Ekranı (Kendi sitenize kurarken config unutursanız)
            if (firebaseError) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-8 text-center">
                        <Activity className="w-16 h-16 text-rose-500 mb-4" />
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">Veritabanı Bağlantı Hatası!</h2>
                        <p className="text-slate-600 max-w-md">Kodu kendi sunucunuza (pnl.tahirurge.com) yüklediyseniz, HTML kodunun içindeki <b>firebaseConfig</b> alanına kendi projenizin ayarlarını yapıştırmayı ve Firebase konsolundan Anonymous girişi aktif etmeyi unutmayın.</p>
                    </div>
                );
            }

            // Şifre Sorulan Login Ekranı
            if (!isLoggedIn) {
                return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
            }

            // Şifre girildi, buluttan veriler iniyor
            if (isLoadingData) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <Activity className="w-12 h-12 text-indigo-500 animate-spin mb-4" />
                        <h2 className="text-xl font-bold text-slate-800">Bulut Verileri Senkronize Ediliyor...</h2>
                        <p className="text-slate-500">Lütfen bekleyin.</p>
                    </div>
                );
            }

            // Ana Uygulama Ekranları
            if (view === 'admin') {
                return <AdminView 
                    posData={posData} setPosData={handleSetPosData}
                    transactions={transactions} setTransactions={handleSetTransactions}
                    banks={banks} setBanks={handleSetBanks}
                    commissionRules={commissionRules} setCommissionRules={handleSetCommissionRules}
                    setView={setView} 
                />;
            }

            return <DashboardView 
                posDailyTrend={posData} 
                recentTransactions={transactions}
                banks={banks}
                commissionRules={commissionRules} 
                setView={setView} 
            />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
